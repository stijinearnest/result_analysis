{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Admin CSS -->
    <link href="{% static 'css/admin_layout.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="admin-wrapper">

    <!-- ================= Sidebar ================= -->
    <aside class="admin-sidebar" id="adminSidebar">

        <div class="sidebar-header">
            <div class="brand">
                <i class="fa-solid fa-gears"></i>
                <span class="brand-text">Admin</span>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <nav class="sidebar-nav">

            <a href="{% url 'admin_dashboard' %}" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="{% url 'add_teacher' %}" class="nav-item">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span>Teachers</span>
            </a>

            <a href="{% url 'manage_departments' %}" class="nav-item">
                <i class="fa-solid fa-building"></i>
                <span>Departments</span>
            </a>

            <a href="{% url 'student_search' %}" class="nav-item">
                <i class="fa-solid fa-user-graduate"></i>
                <span>Students</span>
            </a>

            <a href="{% url 'admin_department_analysis' %}" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Analytics</span>
            </a>

        </nav>

        

    </aside>

    <!-- ================= Main ================= -->
    <div class="admin-main">

        <!-- Topbar -->
        <header class="admin-topbar">

            <div class="topbar-left">
                <h4>Admin Panel</h4>
            </div>

            <div class="topbar-right">

                <span class="admin-user">
                    <i class="fa-solid fa-user-shield"></i>
                    {{ request.user.username }}
                </span>

                <form method="POST" action="{% url 'logout' %}" class="topbar-logout">
                    {% csrf_token %}
                    <button type="submit">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>

            </div>

        </header>

        <!-- Page Content -->
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>

    </div>

</div>

<script src="{% static 'js/admin_layout.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
