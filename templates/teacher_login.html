{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/teacher_login.css' %}">
</head>
<body>

<div class="page-wrapper">

    <!-- LEFT LOGIN SECTION -->
    <div class="login-section">
        <div class="login-card">

            <h2><i class="fas fa-chalkboard-teacher"></i> Teacher Login</h2>
            <p class="subtitle">Manage classes, results & academic insights</p>

            <form method="post">
                {% csrf_token %}

                

                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Login
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="extra-links">
                    <a href="{% url 'password_reset' %}">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>

    <!-- RIGHT ILLUSTRATION SECTION -->
    <div class="illustration-section">
        <img src="{% static 'images/teacher_bg0.png' %}" alt="Teacher Illustration">
    </div>

</div>

</body>
</html>
