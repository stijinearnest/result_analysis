{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
  <h2>✏️ Edit Teacher</h2>

  <form method="post" class="mt-3">
    {% csrf_token %}

    <div class="mb-3">
      <label>Username</label>
      <input type="text" class="form-control" value="{{ teacher.user.username }}" disabled>
    </div>

    <div class="mb-3">
      <label>Full Name</label>
      {{ form.full_name }}
    </div>

    <div class="mb-3">
      <label>Department</label>
      {{ form.department }}
    </div>

    <button class="btn btn-primary">Update</button>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
