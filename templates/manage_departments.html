{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
  <h2>🏢 Manage Departments</h2>

  <a href="{% url 'add_department' %}" class="btn btn-success mb-3">
    ➕ Add Department
  </a>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for dept in departments %}
      <tr>
        <td>{{ dept.name }}</td>
        <td>
          <a href="{% url 'edit_department' dept.id %}" class="btn btn-sm btn-primary">
            Edit
          </a>

          <a href="{% url 'manage_department_courses' dept.id %}"
             class="btn btn-sm btn-warning ms-2">
            Manage Courses
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2" class="text-center">No departments found</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
    ← Back to Admin Dashboard
  </a>
</div>

{% endblock %}
