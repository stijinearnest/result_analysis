
{% block content %}
<div class="form-container">
    <h2>Forgot Password</h2>
    <p>Enter your registered email to receive a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>
    <a href="{% url 'teacher_login' %}">Back to Login</a>
</div>
{% endblock %}
