{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/student_login.css' %}">
</head>
<body>

<div class="page-wrapper">

    <!-- LEFT SIDE ILLUSTRATION -->
    <div class="illustration-section">
        <img src="{% static 'images/student_login0.png' %}" alt="Student Login Illustration">
    </div>

    <!-- RIGHT SIDE FORM -->
    <div class="login-section">
        <div class="login-card">
            <h2><i class="fas fa-user-graduate"></i> Student Login</h2>
            <p class="subtitle">Access your academic dashboard</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Registration Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="reg_no" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <div class="input-wrapper">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="text" name="dob" placeholder="YYYY-MM-DD" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Login →
                </button>

            </form>
        </div>
    </div>

</div>

</body>
</html>
