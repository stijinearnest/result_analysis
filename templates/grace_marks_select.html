{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Apply Grace Marks</h2>
    <p>Select the student and semester to continue.</p>

    {% if messages %}
        {% for msg in messages %}
            <div class="alert alert-warning">{{ msg }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Registration Number</label>
            <input type="text" name="reg_no" class="form-control" required placeholder="Enter registration number">
        </div>

        <div class="mb-3">
            <label>Select Semester</label>
            <select name="semester" class="form-control" required>
                <option value="">-- Select Semester --</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Load Subjects</button>
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
