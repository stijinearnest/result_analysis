{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/home.css' %}">

<div class="page-wrapper">
    <div class="selection-card">

        <div class="header">
            <h2>Select User Type</h2>
            <p>You can change your account at any time</p>
        </div>

        <div class="options">
            <a href="{% url 'teacher_login' %}" class="option-card active">
                <div class="icon">
                    <i class="fas fa-user-tie"></i>
                </div>
                <h5>Teacher</h5>
                <p>Manage student records and academic data</p>
            </a>

            <a href="{% url 'student_login' %}" class="option-card">
                <div class="icon">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h5>Student</h5>
                <p>View your performance and results</p>
            </a>
        </div>

        <div class="action">
            <button class="next-btn">Next</button>
        </div>

    </div>
</div>

{% endblock %}
