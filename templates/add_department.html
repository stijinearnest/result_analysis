{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/add_department.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>➕ Add Department</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Department Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>

    <button class="btn btn-success">Create</button>
    <a href="{% url 'manage_departments' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

{% endblock %}
