{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="success-container">
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h2 class="success-title">Marks Added Successfully!</h2>
        <p class="success-message">
            Marks for <span class="student-name">{{ student_name }}</span> have been saved successfully.
        </p>

        <div class="success-actions">
            <a href="{% url 'select_student_semester' %}" class="btn btn-outline-primary">
                <i class="fas fa-plus-circle"></i>
                Add More Marks
            </a>
            <a href="{% url 'teacher_dashboard' %}" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Go to Dashboard
            </a>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{% static 'css/student_success.css' %}">
{% endblock %}
